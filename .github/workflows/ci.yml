name: MoJ CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set Virtual Environment Path
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "VENV_BIN=.venv/Scripts" >> $GITHUB_ENV
          else
            echo "VENV_BIN=.venv/bin" >> $GITHUB_ENV
          fi

      - name: Create Virtual Environment
        run: |
          python -m venv .venv
          ${{ env.VENV_BIN }}/pip install --upgrade pip

      - name: Install dependencies
        run: |
          ${{ env.VENV_BIN }}/pip install -r requirements.txt

      - name: Run tests
        run: |
          ${{ env.VENV_BIN }}/python -m pytest tests/ -v --tb=short
