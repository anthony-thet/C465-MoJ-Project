name: MoJ CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Virtual Environment
        run: |
          python -m venv .venv
          # The '*' matches 'bin' on Mac and 'Scripts' on Windows
          source .venv/*/activate
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          source .venv/*/activate
          pip install -r requirements.txt

      - name: Run tests
        run: |
          source .venv/*/activate
          python -m pytest tests/ -v --tb=short
