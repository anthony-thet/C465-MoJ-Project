name: MoJ CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    env:
      py: ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Virtual Environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          ${{ env.py }} -m pip install --upgrade pip
          ${{ env.py }} -m pip install -r requirements.txt

      - name: Run tests
        run: ${{ env.py }} -m pytest tests/ -v --tb=short
