services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: moj
      POSTGRES_PASSWORD: moj_dev_password
      POSTGRES_DB: moj
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://moj:moj_dev_password@db/moj
      SECRET_KEY: dev-secret-key-change-in-production
      OLLAMA_BASE_URL: http://ollama:11434
      FLASK_APP: app
      FLASK_ENV: development
    depends_on:
      - db
      - ollama
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
